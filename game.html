<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;background:#f5f2ff;
 color:#252238;text-align:center
}
.container{max-width:900px;margin:auto;padding:20px}
.card{
 background:white;border-radius:24px;padding:24px;
 box-shadow:0 10px 35px rgba(0,0,0,.1)
}
h1{margin:5px 0;font-size:36px}
.subtitle{color:#666}
.status{
 display:flex;justify-content:space-around;
 margin:20px 0;font-size:20px;font-weight:bold
}
.boards{
 display:grid;grid-template-columns:1fr 1fr;
 gap:15px
}
.board{
 position:relative;border-radius:18px;
 overflow:hidden;touch-action:manipulation;
 cursor:crosshair
}
.board svg{display:block;width:100%;height:auto}
.hit{
 position:absolute;
 background:transparent;
 border:0;
 cursor:pointer;
 z-index:10;
 touch-action:manipulation;
}
.diff{
 position:absolute;border:4px solid transparent;
 border-radius:50%;pointer-events:none
}
.diff.found{border-color:#00a86b}
button{
 margin-top:22px;padding:15px 28px;border:0;
 border-radius:14px;background:#252238;color:white;
 font-size:18px;font-weight:bold
}
#message{min-height:28px;margin-top:15px;font-weight:bold}
@media(max-width:650px){
 .boards{grid-template-columns:1fr}
 h1{font-size:30px}
}
</style>
</head>

const hits = document.querySelectorAll(".hit");
const scoreEl = document.getElementById("score");
const pointsEl = document.getElementById("points");
const timeEl = document.getElementById("time");

let found = new Set();
let points = 0;
let time = 60;
let finished = false;

function updateScreen(){
  scoreEl.textContent = found.size;
  pointsEl.textContent = points;
  timeEl.textContent = time;
}

function finish(win){
  finished = true;

  const box = document.createElement("div");
  box.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(37,34,56,.82);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
  `;

  box.innerHTML = `
    <div style="
      background:white;
      padding:35px 25px;
      border-radius:25px;
      max-width:400px;
      width:100%;
      box-shadow:0 15px 50px rgba(0,0,0,.3);
    ">
      <div style="font-size:60px">${win ? "🏆" : "⏰"}</div>
      <h2 style="font-size:30px;margin:10px 0">
        ${win ? "You Won!" : "Time's Up!"}
      </h2>
      <p style="font-size:20px">
        ${win
          ? "Great job! You found all 5 differences."
          : "Try again and find all 5 differences!"}
      </p>
      <p style="font-size:22px;font-weight:bold">
        ⭐ Score: ${points}
      </p>
      <button id="nextLevelBtn" style="
        border:0;
        background:#6c4cff;
        color:white;
        padding:14px 28px;
        border-radius:14px;
        font-size:18px;
        font-weight:bold;
      ">
        ${win && currentLevel < 10 ? "➡️ Next Level" : "🔄 Play Again"}
      </button>
    </div>
  `;

  document.body.appendChild(box);

  const nextBtn = document.getElementById("nextLevelBtn");
  if (nextBtn) {
    nextBtn.addEventListener("click", function(){
      if (win) {
        box.remove();

        if (currentLevel === 1) {
          loadLevel2();
        } else if (currentLevel === 2) {
          loadLevel3();
        } else if (currentLevel === 3) {
          loadLevel4();
        } else if (currentLevel === 4) {
          loadLevel5();
        } else if (currentLevel === 5) {
          loadLevel6();
        } else if (currentLevel === 6) {
          loadLevel7();
        } else if (currentLevel === 7) {
          loadLevel8();
        } else if (currentLevel === 8) {
          loadLevel9();
        } else if (currentLevel === 9) {
          loadLevel10();
        } else {
          location.reload();
        }
      } else {
        location.reload();
      }
    });
  }
}

hits.forEach(hit => {
  hit.addEventListener("pointerdown", function(e){
    e.preventDefault();
    e.stopPropagation();

    if(finished) return;

    const i = this.dataset.i;

    if(found.has(i)) return;

    found.add(i);
    points += Math.max(10, time);

    this.style.border = "4px solid #22c55e";
    this.style.borderRadius = "50%";
    this.style.background = "rgba(34,197,94,.18)";

    updateScreen();

    if(found.size === 5){
      setTimeout(() => finish(true), 350);
    }
  });
});

const timer = setInterval(() => {
  if(finished) return;

  time--;
  updateScreen();

  if(time <= 0){
    clearInterval(timer);
    finish(false);
  }
}, 1000);

updateScreen();
</script>
